{% extends "base.html" %}
{% block title %}Đăng nhập - Kho lạnh{% endblock %}
{% block body %}
<div class="login card">
  <h1 style="margin-bottom:12px">Giám sát kho lạnh</h1>
  <form method="post" class="form" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="u">Tên đăng nhập</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="p">Mật khẩu</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err">{{ error or "" }}</div>
    <button type="submit">Đăng nhập</button>
  </form>
  {% if no_users %}
  <p class="muted" style="margin-top:12px">Chưa có tài khoản nào. Trên máy chủ, chạy:<br>
  <code>python manage.py add-user admin --role admin</code></p>
  {% endif %}
</div>
{% endblock %}
