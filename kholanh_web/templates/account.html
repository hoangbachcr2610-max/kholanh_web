{% extends "base.html" %}
{% set page = 'acc' %}
{% block body %}
<div class="card">
  <h2>Đổi mật khẩu — {{ me['username'] }} ({{ me['role'] }})</h2>
  <div class="form">
    <label for="cur">Mật khẩu hiện tại</label><input id="cur" type="password" autocomplete="current-password">
    <label for="new1">Mật khẩu mới (tối thiểu 8 ký tự)</label><input id="new1" type="password" autocomplete="new-password">
    <label for="new2">Nhập lại mật khẩu mới</label><input id="new2" type="password" autocomplete="new-password">
    <div id="msg" class="err"></div>
    <button id="save">Đổi mật khẩu</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='common.js') }}"></script>
<script src="{{ url_for('static', filename='account.js') }}"></script>
{% endblock %}
